<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131d"><title>Alex IA Ultra</title>
<style>
:root{color-scheme:dark;--bg:#0d1018;--panel:#171c29;--line:#2b3448;--accent:#8b5cf6;--text:#f4f5fb;--muted:#a7afc2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#20203a 0,#0d1018 55%);color:var(--text);font:15px system-ui,Arial;min-height:100vh}
header{position:sticky;top:0;background:#10131deF;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:2}
.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#8b5cf6,#2563eb);display:grid;place-items:center;font-size:21px}
header strong{font-size:17px}header small{display:block;color:var(--muted)}
main{max-width:850px;margin:auto;padding:22px 14px 150px}
.welcome{text-align:center;padding:30px 10px 24px}.welcome h1{font-size:28px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0}
#messages{display:flex;flex-direction:column;gap:14px}
.msg{max-width:90%;padding:13px 15px;border:1px solid var(--line);border-radius:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:#39266b;border-color:#6345a7}.assistant{align-self:flex-start;background:var(--panel)}
.msg img{max-width:100%;border-radius:12px;margin-top:8px}
.composer{position:fixed;bottom:0;left:0;right:0;padding:12px max(12px,calc((100vw - 820px)/2));background:#0d1018ed;border-top:1px solid var(--line);backdrop-filter:blur(12px)}
#preview{display:none;max-width:820px;margin:0 auto 8px;color:var(--muted)}#preview img{height:65px;border-radius:8px;vertical-align:middle;margin-right:8px}
.row{max-width:820px;margin:auto;display:flex;gap:8px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px}
textarea{flex:1;resize:none;min-height:44px;max-height:130px;border:0;outline:0;background:transparent;color:var(--text);padding:11px;font:inherit}
button,.filebtn{border:0;border-radius:12px;padding:12px 14px;background:#292f40;color:white;font-weight:600;cursor:pointer}
button.primary{background:var(--accent)}button:disabled{opacity:.5}.tools{max-width:820px;margin:8px auto 0;display:flex;gap:8px;align-items:center}.tools button{font-size:13px;padding:9px 11px}.hint{color:var(--muted);font-size:12px;margin-left:auto}
#status{max-width:820px;margin:6px auto;color:#c4b5fd;font-size:13px}
a{color:#c4b5fd}
</style></head>
<body>
<header><div class="logo">✦</div><div><strong>Alex IA Ultra</strong><small>Assistente inteligente</small></div></header>
<main><section class="welcome" id="welcome"><h1>Como posso ajudar?</h1><p>Converse, envie uma imagem ou crie uma imagem por descrição.</p></section><section id="messages" aria-live="polite"></section></main>
<section class="composer">
<div id="preview"></div>
<div class="row"><label class="filebtn" title="Anexar imagem">＋<input id="file" type="file" accept="image/*" hidden></label><textarea id="prompt" placeholder="Mensagem para Alex IA Ultra..." rows="1"></textarea><button class="primary" id="send">Enviar</button></div>
<div class="tools"><button id="makeImage">🎨 Gerar imagem</button><button id="clear">Limpar conversa</button><span class="hint">Enter envia · Shift+Enter quebra linha</span></div><div id="status"></div>
</section>
<script>
const $=s=>document.querySelector(s), messages=$('#messages');let history=[],imageData=null,imageMime=null;
function add(role,text,image){const d=document.createElement('div');d.className='msg '+role;d.textContent=text||'';if(image){const im=document.createElement('img');im.src=image;im.alt='Imagem';d.appendChild(im)}messages.appendChild(d);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});return d}
function busy(v,label='Alex está pensando…'){$('#send').disabled=v;$('#makeImage').disabled=v;$('#status').textContent=v?label:''}
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(f.size>10*1024*1024){$('#status').textContent='A imagem deve ter até 10 MB.';return}imageMime=f.type||'image/jpeg';const reader=new FileReader();reader.onload=()=>{imageData=reader.result;$('#preview').style.display='block';$('#preview').innerHTML='<img src="'+imageData+'"> '+f.name+' <button id="removeImage">Remover</button>';$('#removeImage').onclick=()=>{imageData=null;imageMime=null;$('#file').value='';$('#preview').style.display='none'}};reader.readAsDataURL(f)});
async function sendChat(){const q=$('#prompt').value.trim();if(!q&&!imageData)return;add('user',q||'Analise esta imagem.',imageData);$('#prompt').value='';busy(true);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pergunta:q,historico:history,imagem:imageData,image_mime_type:imageMime})});const data=await r.json();if(!r.ok)throw new Error(data.detail||'Falha na API');const answer=data.resposta||data.error||'Não houve resposta.';add('assistant',answer,data.imagem_url||data.imagem);history.push({role:'user',content:q||'[imagem enviada]'}, {role:'assistant',content:answer});history=history.slice(-20);if(!data.success)$('#status').textContent=data.erro||'A API retornou uma falha.'}catch(e){add('assistant','Não consegui conectar à API: '+e.message)}finally{imageData=null;imageMime=null;$('#file').value='';$('#preview').style.display='none';busy(false)}}
async function generateImage(){const q=$('#prompt').value.trim();if(!q){$('#status').textContent='Descreva a imagem que deseja criar.';return}add('user','🎨 Criar imagem: '+q);$('#prompt').value='';busy(true,'Gerando imagem… pode levar alguns minutos.');try{const r=await fetch('/api/imagem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:q})});const data=await r.json();if(!r.ok||!data.success)throw new Error(data.error||data.erro||'O gerador não concluiu.');const url=data.imagem_url||data.imagem;add('assistant','Imagem gerada'+(data.motor?' · '+data.motor:''),url)}catch(e){add('assistant','A geração não foi concluída: '+e.message)}finally{busy(false)}}
$('#send').onclick=sendChat;$('#makeImage').onclick=generateImage;$('#clear').onclick=()=>{messages.innerHTML='';history=[];$('#status').textContent='Conversa limpa.'};$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});
</script></body></html>
